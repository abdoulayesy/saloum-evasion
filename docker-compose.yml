services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: saloum
      POSTGRES_PASSWORD: saloum
      POSTGRES_DB: saloum_evasion
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saloum -d saloum_evasion']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
